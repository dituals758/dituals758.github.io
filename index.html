<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">

  <!-- Защита от индексации -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="theme-color" content="#000000">

  <!-- Настройки для iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Операции">

  <title>Операции</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="segmented" role="tablist" aria-label="Тип операции">
        <button type="button" class="segment active" id="btn-expense" role="tab" aria-selected="true">Расход</button>
        <button type="button" class="segment" id="btn-income" role="tab" aria-selected="false">Доход</button>
      </div>
    </header>

    <section class="app-content">
      <div class="amount-container">
        <input
          type="text"
          id="amount"
          class="amount-input"
          placeholder="0"
          inputmode="decimal"
          enterkeyhint="done"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="15"
          aria-label="Сумма"
        >
        <span class="amount-symbol">₽</span>
      </div>

      <div id="categories-grid" class="categories-grid" role="group" aria-label="Категории"></div>

      <input
        type="text"
        id="note"
        class="note-input"
        placeholder="Комментарий"
        enterkeyhint="done"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        maxlength="200"
        aria-label="Комментарий"
      >
    </section>

    <footer class="app-footer">
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <button type="button" id="submit-btn" class="submit-btn">Записать</button>
      <div class="app-version" id="app-version">Загрузка...</div>
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
